<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python in HTML</title>
    
    <!-- Link to PyScript assets -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>My First PyScript Page</h1>
    
    <!-- Write your Python code here -->
    <script type="py">
        print("Hello from Python running inside HTML!")
        
        # You can even use standard Python logic
        for i in range(3):
            print(f"Looping step: {i}")
    </script>

</body>
</html>
